<text x="773" y="115" fill="#57606a" text-anchor="middle" font-size="12">generic</text>
<text x="773" y="129" fill="#57606a" text-anchor="middle" font-size="12">2022-02-24</text>
<line x1="557" y1="95" x2="443" y2="95" stroke="#b42318" stroke-width="2.5"/>
<text x="500" y="73" fill="#b42318" text-anchor="middle" font-size="12">named</text>
