<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" font-family="Arial, sans-serif" font-size="13">
<title>When each link of the map became public</title>
<rect width="1000" height="360" fill="#ffffff"/>
<line x1="557" y1="150" x2="443" y2="150" stroke="#b42318" stroke-width="2.5"/>
<text x="500" y="128" fill="#b42318" text-anchor="middle" font-size="12">named</text>
<text x="500" y="142" fill="#b42318" text-anchor="middle" font-size="12">2025-10-17</text>
<text x="500" y="170" fill="#57606a" text-anchor="middle" font-size="12">generic</text>
<text x="500" y="184" fill="#57606a" text-anchor="middle" font-size="12">2024-01-03</text>
<line x1="830" y1="60" x2="717" y2="150" stroke="#b42318" stroke-width="2.5"/>
<text x="758" y="16" fill="#b42318" text-anchor="middle" font-size="12">named</text>
<text x="758" y="30" fill="#b42318" text-anchor="middle" font-size="12">2025-10-17</text>
<line x1="283" y1="150" x2="170" y2="150" stroke="#0b5cad" stroke-width="2.5"/>
<text x="227" y="128" fill="#0b5cad" text-anchor="middle" font-size="12">named</text>
<text x="227" y="142" fill="#0b5cad" text-anchor="middle" font-size="12">2020-09-18</text>
<line x1="830" y1="240" x2="717" y2="150" stroke="#0b5cad" stroke-width="2.5"/>
<text x="758" y="270" fill="#0b5cad" text-anchor="middle" font-size="12">named</text>
<text x="758" y="284" fill="#0b5cad" text-anchor="middle" font-size="12">2018-10-25</text>
<rect x="10" y="127" width="160" height="46" rx="6" fill="#f6f8fa" stroke="#1f2328"/>
<text x="90" y="155" fill="#1f2328" text-anchor="middle">Vehicle makers</text>
<rect x="283" y="127" width="160" height="46" rx="6" fill="#f6f8fa" stroke="#1f2328"/>
<text x="363" y="155" fill="#1f2328" text-anchor="middle">Tier-1 module suppliers</text>
<rect x="557" y="127" width="160" height="46" rx="6" fill="#f6f8fa" stroke="#1f2328"/>
<text x="637" y="155" fill="#1f2328" text-anchor="middle">Nexperia (NL)</text>
<rect x="830" y="37" width="160" height="46" rx="6" fill="#f6f8fa" stroke="#1f2328"/>
<text x="910" y="65" fill="#1f2328" text-anchor="middle">Nexperia China (assembly)</text>
<rect x="830" y="217" width="160" height="46" rx="6" fill="#f6f8fa" stroke="#1f2328"/>
<text x="910" y="245" fill="#1f2328" text-anchor="middle">Wingtech (owner, CN)</text>
<text x="30" y="340" fill="#57606a" font-size="12">Each line joins a supplier or owner (right) to its customer (left). Blue: named in public before the US listing of 2 Dec 2024. Red: named only later. Dashed grey: only a generic public statement.</text>
</svg>